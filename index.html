<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant CMS — a CMS for ants</title>
<style>
  :root {
    --soil: #2b1a0e;
    --soil-2: #3d2614;
    --sand: #e8d5b5;
    --sand-2: #f4e9d6;
    --amber: #d9822b;
    --amber-2: #f0a94b;
    --ink: #1c120a;
    --ink-soft: #5a4632;
    --leaf: #6b8e23;
    --danger: #a83a2a;
    --radius: 14px;
    --shadow: 0 6px 20px rgba(43, 26, 14, .25);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(240,169,75,.18), transparent 50%),
      repeating-linear-gradient(135deg, rgba(43,26,14,.035) 0 2px, transparent 2px 14px),
      var(--sand-2);
    min-height: 100%;
  }
  body {
    font: 16px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    color: var(--ink);
    min-height: 100vh;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  a { color: var(--amber); }
  a:hover { color: var(--soil); }
  :focus-visible { outline: 3px solid var(--amber-2); outline-offset: 2px; }

  /* ---- Header with marching ants ---- */
  header.site {
    background: linear-gradient(180deg, var(--soil), var(--soil-2));
    color: var(--sand-2);
    padding: 1rem 1.25rem .75rem;
    border-bottom: 6px solid var(--amber);
    position: relative;
    overflow: hidden;
  }
  header.site .row { max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; }
  header.site h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
  header.site h1 a { color: inherit; text-decoration: none; }
  header.site h1 small { display: block; font-size: .8rem; font-weight: normal; opacity: .75; font-style: italic; }
  header.site nav { margin-left: auto; display: flex; gap: .25rem; flex-wrap: wrap; }
  header.site nav a, header.site nav button {
    color: var(--sand-2); text-decoration: none; padding: .4rem .8rem; border-radius: 999px;
    border: 1px solid rgba(232,213,181,.35); background: transparent; font: inherit; cursor: pointer;
  }
  header.site nav a[aria-current="page"], header.site nav a:hover, header.site nav button:hover { background: var(--amber); border-color: var(--amber); color: var(--ink); }
  .trail {
    position: absolute; left: 0; right: 0; bottom: 0; height: 14px; overflow: hidden; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }
  .trail span {
    position: absolute; bottom: 1px; font-size: 11px; line-height: 1; opacity: .9;
    animation: march 14s linear infinite;
  }
  @keyframes march { from { transform: translateX(110vw) scaleX(-1); } to { transform: translateX(-30px) scaleX(-1); } }
  @media (prefers-reduced-motion: reduce) { .trail span { animation: none; } body { transition: none; } }

  nav.pages { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1.5rem; padding: .6rem .75rem; background: var(--soil-2); border-radius: 999px; box-shadow: var(--shadow); }
  nav.pages a { color: var(--sand-2); text-decoration: none; padding: .3rem .85rem; border-radius: 999px; font-size: .95rem; }
  nav.pages a:hover { background: rgba(232,213,181,.18); color: var(--sand-2); }
  nav.pages a[aria-current="page"] { background: var(--amber); color: var(--ink); }
  nav.pages a::before { content: "🐜 "; font-size: .75em; opacity: .7; }
  nav.pages a[aria-current="page"]::before { content: "👑 "; }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  .crumbs { font-size: .9rem; color: var(--ink-soft); margin: 0 0 1rem; }
  .crumbs a { color: var(--ink-soft); }
  h2.title { font-size: 2.1rem; margin: 0 0 .25rem; color: var(--soil); line-height: 1.15; }
  .meta { color: var(--ink-soft); font-size: .85rem; margin-bottom: 1.5rem; }

  /* ---- Tunnel cards ---- */
  .tunnels { list-style: none; padding: 0; margin: 1.5rem 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .tunnel {
    background: var(--sand); border-radius: var(--radius) var(--radius) 40px 40px; padding: 1.1rem 1.2rem 1.4rem;
    box-shadow: var(--shadow); border: 2px solid var(--soil-2); position: relative; transition: transform .15s;
  }
  .tunnel:hover { transform: translateY(-3px); }
  .tunnel::before { content: "🐜"; position: absolute; right: 12px; bottom: 8px; font-size: 1.1rem; opacity: .6; }
  .tunnel h3 { margin: 0 0 .35rem; font-size: 1.2rem; }
  .tunnel h3 a { color: var(--soil); text-decoration: none; }
  .tunnel h3 a:hover { text-decoration: underline; }
  .tunnel p { margin: 0; color: var(--ink-soft); font-size: .95rem; }
  .tunnel .actions { margin-top: .75rem; display: flex; gap: .5rem; flex-wrap: wrap; }

  /* ---- Article ---- */
  article.page { background: var(--sand-2); border: 2px solid var(--sand); border-radius: var(--radius); padding: 1.75rem 2rem; box-shadow: var(--shadow); }
  article.page .body h1, article.page .body h2 { color: var(--soil); }
  article.page .body ul { padding-left: 1.4rem; }
  article.page .body li::marker { content: "🐜 "; }

  /* ---- Forms / buttons ---- */
  .btn {
    display: inline-block; font: inherit; font-size: .95rem; padding: .55rem 1.1rem; border-radius: 999px; cursor: pointer;
    background: var(--amber); color: var(--ink); border: 2px solid var(--soil-2); text-decoration: none;
  }
  .btn:hover { background: var(--amber-2); }
  .btn.ghost { background: transparent; color: var(--soil); }
  .btn.ghost:hover { background: var(--sand); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  form.editor { display: grid; gap: 1rem; background: var(--sand); padding: 1.5rem; border-radius: var(--radius); border: 2px solid var(--soil-2); box-shadow: var(--shadow); }
  form.editor label { font-weight: bold; color: var(--soil); display: grid; gap: .3rem; }
  form.editor label span.hint { font-weight: normal; font-size: .85rem; color: var(--ink-soft); }
  form.editor input, form.editor textarea {
    font: inherit; padding: .6rem .75rem; border: 2px solid var(--soil-2); border-radius: 8px; background: var(--sand-2); color: var(--ink); width: 100%;
  }
  form.editor textarea { min-height: 260px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92rem; }
  form.editor .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  form.editor .bar .spacer { flex: 1; }
  .err { color: var(--danger); font-weight: bold; margin: 0; }
  [role="status"] { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--soil); color: var(--sand-2); padding: .6rem 1.2rem; border-radius: 999px; box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; pointer-events: none; }
  [role="status"].show { opacity: 1; }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); }
  .empty .big { font-size: 3rem; }
  details.help { margin-top: .5rem; font-size: .9rem; color: var(--ink-soft); }
  details.help code { background: var(--sand-2); padding: 0 .3em; border-radius: 4px; }
  .preview { background: var(--sand-2); border: 2px dashed var(--soil-2); border-radius: 8px; padding: 1rem; min-height: 4rem; }

  /* ---- The joke: ant scale ---- */
  body.ant-scale { transform: scale(.34); transform-origin: top center; }
  body.ant-scale .trail span { font-size: 6px; }
  footer.site { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 2rem 1rem; }
</style>
</head>
<body>
<header class="site">
  <div class="row">
    <h1><a href="#/">🐜 Ant CMS <small>a content management system for ants</small></a></h1>
    <nav aria-label="Primary" id="nav">
      <a href="#/" data-nav="home">Colony</a>
      <a href="#/colony" data-nav="admin">🛠 CMS</a>
      <button type="button" id="scaleBtn" aria-pressed="false" title="Toggle ant-sized view">Ant scale</button>
    </nav>
  </div>
  <div class="trail" aria-hidden="true" id="trail"></div>
</header>

<main id="main" tabindex="-1"></main>
<footer class="site">Nothing leaves the nest.</footer>
<div role="status" aria-live="polite" id="toast"></div>

<!-- ===================== CORE: pure logic, no DOM ===================== -->
<script id="antcms-core">
(function (root) {
  'use strict';

  const SLUG_MAX = 64;
  const TITLE_MAX = 120;
  const BODY_MAX = 50000;
  const RESERVED = new Set(['colony', 'new', 'edit', 'p']);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function slugify(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFKD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, SLUG_MAX)
      .replace(/-+$/g, '');
  }

  function findPage(pages, slug) {
    return pages.find(p => p.slug === slug) || null;
  }

  // Returns array of error strings (empty when valid).
  function validate(pages, input, currentSlug) {
    const errors = [];
    const title = String(input.title || '').trim();
    const slug = String(input.slug || '');
    const body = String(input.body || '');
    if (!title) errors.push('Title is required.');
    if (title.length > TITLE_MAX) errors.push(`Title must be ${TITLE_MAX} characters or fewer.`);
    if (!slug) errors.push('Slug is required (a title usually makes one for you).');
    else if (slug !== slugify(slug)) errors.push('Slug may only contain lowercase letters, numbers and single hyphens.');
    else if (RESERVED.has(slug)) errors.push(`"${slug}" is a reserved word.`);
    if (body.length > BODY_MAX) errors.push('Body is too long for an ant to carry.');
    const clash = findPage(pages, slug);
    if (clash && clash.slug !== currentSlug) errors.push(`A page with slug "${slug}" already exists.`);
    return errors;
  }

  function normalise(input) {
    return {
      title: String(input.title || '').trim(),
      slug: String(input.slug || '').trim() || slugify(input.title),
      body: String(input.body || ''),
    };
  }

  function createPage(pages, input, now) {
    const data = normalise(input);
    const errors = validate(pages, data, null);
    if (errors.length) return { ok: false, errors, pages };
    const ts = now == null ? Date.now() : now;
    const page = { ...data, createdAt: ts, updatedAt: ts };
    return { ok: true, page, pages: [...pages, page] };
  }

  function updatePage(pages, slug, input, now) {
    const existing = findPage(pages, slug);
    if (!existing) return { ok: false, errors: ['Page not found.'], pages };
    const data = normalise(input);
    const errors = validate(pages, data, slug);
    if (errors.length) return { ok: false, errors, pages };
    const page = { ...existing, ...data, updatedAt: now == null ? Date.now() : now };
    return { ok: true, page, pages: pages.map(p => (p.slug === slug ? page : p)) };
  }

  function deletePage(pages, slug) {
    if (!findPage(pages, slug)) return { ok: false, errors: ['Page not found.'], pages };
    return { ok: true, pages: pages.filter(p => p.slug !== slug) };
  }

  const SAFE_URL = /^(https?:\/\/|mailto:|#)/i;
  function inline(text) {
    let s = escapeHtml(text);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) =>
      SAFE_URL.test(url) ? `<a href="${url}">${label}</a>` : m);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  }

  // Tiny, safe markup -> HTML. All text is escaped before any tags are added.
  function render(body) {
    const out = [];
    const blocks = String(body || '').replace(/\r\n?/g, '\n').split(/\n{2,}/);
    for (const block of blocks) {
      const lines = block.split('\n').filter(l => l.trim() !== '');
      if (!lines.length) continue;
      if (lines.every(l => /^- /.test(l))) {
        out.push('<ul>' + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>');
      } else if (lines.length === 1 && /^## /.test(lines[0])) {
        out.push(`<h2>${inline(lines[0].slice(3))}</h2>`);
      } else if (lines.length === 1 && /^# /.test(lines[0])) {
        out.push(`<h1>${inline(lines[0].slice(2))}</h1>`);
      } else {
        out.push(`<p>${lines.map(inline).join('<br>')}</p>`);
      }
    }
    return out.join('\n');
  }

  function excerpt(body, max = 120) {
    const text = String(body || '').replace(/[#*\-\[\]()]/g, ' ').replace(/\s+/g, ' ').trim();
    return text.length > max ? text.slice(0, max - 1).trimEnd() + '…' : text;
  }

  // Accepts whatever came out of storage; returns only well-formed pages.
  function sanitisePages(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = new Set();
    const out = [];
    for (const p of raw) {
      if (!p || typeof p !== 'object') continue;
      const slug = String(p.slug || '');
      if (!slug || slug !== slugify(slug) || seen.has(slug)) continue;
      seen.add(slug);
      out.push({
        slug,
        title: String(p.title || slug),
        body: String(p.body || ''),
        createdAt: Number(p.createdAt) || 0,
        updatedAt: Number(p.updatedAt) || 0,
      });
    }
    return out;
  }

  const api = { escapeHtml, slugify, findPage, validate, createPage, updatePage, deletePage, render, excerpt, sanitisePages, RESERVED };
  root.AntCMSCore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!-- ===================== APP: storage, router, UI ===================== -->
<script>
(function () {
  'use strict';
  const C = window.AntCMSCore;
  const KEY = 'antcms.pages.v1';
  const $main = document.getElementById('main');
  const $toast = document.getElementById('toast');

  /* ---------- store (falls back to memory if storage is blocked) ---------- */
  const mem = new Map();
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch { return mem.has(k) ? mem.get(k) : null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { mem.set(k, v); } },
  };
  function load() {
    try { return C.sanitisePages(JSON.parse(storage.get(KEY) || '[]')); }
    catch { return []; }
  }
  function save(pages) {
    try { storage.set(KEY, JSON.stringify(pages)); return true; }
    catch { toast('Could not save the page.'); return false; }
  }
  function seed() {
    if (storage.get(KEY) !== null) return;
    const r = C.createPage([], {
      title: 'Welcome to the nest',
      slug: 'welcome',
      body: [
        '# What is this, a CMS for ants?',
        '',
        'Yes. It needs to be at least **three times smaller**.',
        '',
        'There is no server, no build step, and no libraries. Just one HTML file carrying a crumb many times its own weight.',
        '',
        '## Getting around',
        '',
        '- The *Colony* is the public site: every page is a tunnel.',
        '- The *Queen\'s Chamber* is where pages are laid, edited and, regrettably, eaten.',
        '- Press *Ant scale* in the header to view the site at its intended size.',
        '',
        'Now go and [make a page](#/colony/new).',
      ].join('\n'),
    });
    if (r.ok) save(r.pages);
  }

  /* ---------- helpers ---------- */
  const esc = C.escapeHtml;
  let toastTimer;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 2800);
  }
  function fmt(ts) {
    return ts ? new Date(ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
  }
  function go(hash) { location.hash = hash; }
  // First click arms the button, second click within 4s runs fn.
  function armed(btn, fn) {
    btn.addEventListener('click', () => {
      if (btn.dataset.armed) { fn(); return; }
      const label = btn.textContent;
      btn.dataset.armed = '1'; btn.textContent = 'Really delete?';
      setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 4000);
    });
  }
  function setNav(which) {
    document.querySelectorAll('#nav a[data-nav]').forEach(a => {
      if (a.dataset.nav === which) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function setTitle(t) { document.title = (t ? t + ' · ' : '') + 'Ant CMS'; }

  /* ---------- views ---------- */
  function siteNav(pages, current) {
    if (!pages.length) return '';
    const sorted = [...pages].sort((a, b) => a.createdAt - b.createdAt);
    return `<nav class="pages" aria-label="Pages">${sorted.map(p =>
      `<a href="#/p/${esc(p.slug)}" ${p.slug === current ? 'aria-current="page"' : ''}>${esc(p.title)}</a>`).join('')}</nav>`;
  }
  function viewHome(pages) {
    setNav('home'); setTitle('');
    const sorted = [...pages].sort((a, b) => b.updatedAt - a.updatedAt);
    $main.innerHTML = `
      ${siteNav(pages, null)}
      <h2 class="title">The Colony</h2>
      <p class="meta">${sorted.length} tunnel${sorted.length === 1 ? '' : 's'} dug so far.</p>
      ${sorted.length ? `<ul class="tunnels">${sorted.map(p => `
        <li class="tunnel">
          <h3><a href="#/p/${esc(p.slug)}">${esc(p.title)}</a></h3>
          <p>${esc(C.excerpt(p.body))}</p>
        </li>`).join('')}</ul>`
      : `<div class="empty"><div class="big">🐜</div><p>No tunnels yet. <a href="#/colony/new">Dig the first one.</a></p></div>`}`;
  }

  function viewPage(pages, slug) {
    setNav('home');
    const p = C.findPage(pages, slug);
    if (!p) return notFound(slug);
    setTitle(p.title);
    $main.innerHTML = `
      ${siteNav(pages, p.slug)}
      <p class="crumbs"><a href="#/">Colony</a> › ${esc(p.title)}</p>
      <article class="page">
        <h2 class="title">${esc(p.title)}</h2>
        <p class="meta">Updated ${esc(fmt(p.updatedAt))} · <a href="#/colony/edit/${esc(p.slug)}">Edit</a></p>
        <div class="body">${C.render(p.body)}</div>
      </article>`;
  }

  function viewAdmin(pages) {
    setNav('admin'); setTitle("Queen's Chamber");
    const sorted = [...pages].sort((a, b) => b.updatedAt - a.updatedAt);
    $main.innerHTML = `
      <h2 class="title">Queen's Chamber</h2>
      <p class="meta">Lay, edit and remove pages. <a class="btn" href="#/colony/new">+ New page</a></p>
      ${sorted.length ? `<ul class="tunnels">${sorted.map(p => `
        <li class="tunnel">
          <h3><a href="#/colony/edit/${esc(p.slug)}">${esc(p.title)}</a></h3>
          <p>/${esc(p.slug)} · updated ${esc(fmt(p.updatedAt))}</p>
          <div class="actions">
            <a class="btn ghost" href="#/p/${esc(p.slug)}">View</a>
            <a class="btn ghost" href="#/colony/edit/${esc(p.slug)}">Edit</a>
            <button class="btn danger" type="button" data-delete="${esc(p.slug)}">Delete</button>
          </div>
        </li>`).join('')}</ul>`
      : `<div class="empty"><div class="big">👑</div><p>The chamber is empty. <a href="#/colony/new">Lay the first page.</a></p></div>`}`;
    $main.querySelectorAll('[data-delete]').forEach(btn => armed(btn, () => {
      const r = C.deletePage(pages, btn.dataset.delete);
      if (r.ok && save(r.pages)) { toast('Page removed.'); route(); }
    }));
  }

  function viewEditor(pages, slug) {
    setNav('admin');
    const existing = slug ? C.findPage(pages, slug) : null;
    if (slug && !existing) return notFound(slug);
    setTitle(existing ? 'Edit ' + existing.title : 'New page');
    const v = existing || { title: '', slug: '', body: '' };
    $main.innerHTML = `
      <p class="crumbs"><a href="#/colony">Queen's Chamber</a> › ${existing ? 'Edit' : 'New page'}</p>
      <h2 class="title">${existing ? 'Edit page' : 'Lay a new page'}</h2>
      <form class="editor" id="editor" novalidate>
        <p class="err" id="errors" aria-live="assertive"></p>
        <label>Title <input name="title" required maxlength="120" value="${esc(v.title)}" autocomplete="off"></label>
        <label>Slug <span class="hint">The address: #/p/<em>slug</em>. Lowercase letters, numbers, hyphens.</span>
          <input name="slug" maxlength="64" value="${esc(v.slug)}" autocomplete="off" spellcheck="false" ${existing ? 'data-touched' : ''}></label>
        <label>Body
          <span class="hint">Blank line = new paragraph. <code># Heading</code>, <code>## Subheading</code>, <code>- list item</code>, <code>**bold**</code>, <code>*italic*</code>, <code>[link](https://…)</code>.</span>
          <textarea name="body">${esc(v.body)}</textarea></label>
        <details class="help"><summary>Preview</summary><div class="preview body" id="preview"></div></details>
        <div class="bar">
          <button class="btn" type="submit">${existing ? 'Save changes' : 'Create page'}</button>
          <a class="btn ghost" href="${existing ? '#/p/' + esc(existing.slug) : '#/colony'}">Cancel</a>
          <span class="spacer"></span>
          ${existing ? `<button class="btn danger" type="button" id="del">Delete</button>` : ''}
        </div>
      </form>`;

    const form = document.getElementById('editor');
    const title = form.elements.title, slugEl = form.elements.slug, body = form.elements.body;
    const $err = document.getElementById('errors'), $prev = document.getElementById('preview');

    // Auto-slug from title until the user edits the slug by hand.
    title.addEventListener('input', () => { if (!slugEl.hasAttribute('data-touched')) slugEl.value = C.slugify(title.value); });
    slugEl.addEventListener('input', () => slugEl.setAttribute('data-touched', ''));
    const renderPreview = () => { $prev.innerHTML = C.render(body.value); };
    body.addEventListener('input', renderPreview);
    form.querySelector('details').addEventListener('toggle', renderPreview);

    form.addEventListener('submit', e => {
      e.preventDefault();
      const input = { title: title.value, slug: slugEl.value, body: body.value };
      const r = existing ? C.updatePage(pages, existing.slug, input) : C.createPage(pages, input);
      if (!r.ok) { $err.textContent = r.errors.join(' '); title.focus(); return; }
      if (!save(r.pages)) return;
      toast(existing ? 'Saved.' : 'Page created.');
      go('#/p/' + r.page.slug);
    });
    const del = document.getElementById('del');
    if (del) armed(del, () => {
      const r = C.deletePage(pages, existing.slug);
      if (r.ok && save(r.pages)) { toast('Page removed.'); go('#/colony'); }
    });
    title.focus();
  }

  function notFound(slug) {
    setTitle('Not found');
    $main.innerHTML = `<div class="empty"><div class="big">🕳️</div><h2 class="title">No tunnel here</h2>
      <p>Nothing lives at <code>${esc(slug)}</code>. <a href="#/">Back to the colony</a> or <a href="#/colony/new">dig it</a>.</p></div>`;
  }

  /* ---------- router ---------- */
  function route() {
    const pages = load();
    const path = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
    if (path.length === 0) viewHome(pages);
    else if (path[0] === 'p' && path[1]) viewPage(pages, path[1]);
    else if (path[0] === 'colony' && path.length === 1) viewAdmin(pages);
    else if (path[0] === 'colony' && path[1] === 'new') viewEditor(pages, null);
    else if (path[0] === 'colony' && path[1] === 'edit' && path[2]) viewEditor(pages, path[2]);
    else notFound(location.hash);
    if (!$main.contains(document.activeElement)) $main.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /* ---------- decorations ---------- */
  const trail = document.getElementById('trail');
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('span');
    s.textContent = '🐜';
    s.style.animationDelay = (-i * 1.6) + 's';
    s.style.animationDuration = (12 + (i % 3) * 2) + 's';
    trail.appendChild(s);
  }
  const scaleBtn = document.getElementById('scaleBtn');
  function applyScale(on) {
    document.body.classList.toggle('ant-scale', on);
    scaleBtn.setAttribute('aria-pressed', String(on));
    scaleBtn.textContent = on ? 'Human scale' : 'Ant scale';
    storage.set('antcms.scale', on ? '1' : '0');
  }
  scaleBtn.addEventListener('click', () => {
    const on = !document.body.classList.contains('ant-scale');
    applyScale(on);
    toast(on ? 'There. Now it is a CMS for ants.' : 'Ugh. Now it is a CMS for humans.');
  });
  const scaleOn = storage.get('antcms.scale') === '1';
  applyScale(scaleOn);

  /* ---------- boot ---------- */
  try { seed(); } catch (e) { console.error(e); }
  window.addEventListener('hashchange', route);
  window.addEventListener('storage', e => { if (e.key === KEY) route(); });
  route();
})();
</script>
</body>
</html>
